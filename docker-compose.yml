services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: muletrace
      POSTGRES_USER: muletrace
      POSTGRES_PASSWORD: muletrace-local
    ports: ["5432:5432"]
    volumes: [muletrace_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muletrace"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://muletrace:muletrace-local@db:5432/muletrace
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-me-12345}
      COOKIE_SECURE: "false"
      DEMO_MODE: "true"
      CORS_ORIGINS: http://localhost:5173
      NEO4J_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-muletrace-neo4j-local}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      neo4j: {condition: service_healthy}
  web:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on: [api]
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-muletrace-neo4j-local}
    ports: ["7474:7474", "7687:7687"]
    volumes: [muletrace_neo4j:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 8s
      timeout: 4s
      retries: 15
volumes:
  muletrace_pg:
  muletrace_neo4j:

